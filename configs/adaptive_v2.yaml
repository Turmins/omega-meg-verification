version: adaptive_v2
base_run: outputs/verification_v1
models: [eegnet, graph]
seed: 2409
embedding_dim: 64
enrollment_seconds: [30, 240]
durations: [10, 30, 60]
stream_repetitions: 5
graph_neighbors: 12
eegnet:
  temporal_filters: 8
  depth_multiplier: 2
  pointwise_filters: 16
  temporal_kernel: 33
  dropout: 0.25
graph:
  hidden: 32
  sensor_embedding: 8
  layers: 2
  dropout: 0.15
train:
  epochs: 30
  batches_per_epoch: 24
  subjects_per_batch: 8
  windows_per_session: 2
  learning_rate: 0.001
  weight_decay: 0.001
  temperature: 0.1
  eval_every: 2
  patience: 5
  selection_enrollment_seconds: 30
  selection_duration: 30
  cpu_threads: 4
adaptation:
  alpha: 0.05
  anchor_weight: 0.1
  update_development_far: 0.01
