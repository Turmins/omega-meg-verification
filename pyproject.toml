[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-meg-verification-publication"
version = "0.2.0"
description = "Source checkout for the frozen V1/V2 educational MEG verification experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4", "scipy==1.15.3", "pandas==2.2.3",
  "scikit-learn==1.7.2", "torch==2.5.1", "matplotlib==3.9.2",
  "pyyaml==6.0.2", "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["external_artifacts: needs restored historical V1/V2 runs"]
